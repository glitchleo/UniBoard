name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uniboard
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: uniboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniboard -d uniboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://uniboard:ci-only-password@127.0.0.1:5432/uniboard_test
